version: "3"

services:
 # Web app in Python 
  web:
   build: .
   ports:
     - 8000:8000
   volumes:
     - .:/app
     - application-logs:/app/logs/
   networks:
     - my-network
   environment:
     - REDIS_HOST=redis-db
   depends_on:
     - redis-db  # depends on redis-db

  redis-db:
    image: "redis:7-alpine"
    volumes:
      - redis-data:/data
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  application-logs:
  redis-data:
